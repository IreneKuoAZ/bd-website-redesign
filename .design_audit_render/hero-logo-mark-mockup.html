<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Better Direct AI — Hero direction</title>
  <style>
    :root { --navy: #042b53; --blue: #1462d0; --pale: #eaf4fc; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--navy); font-family: Inter, Arial, sans-serif; }
    .mockup { min-height: 100vh; overflow: hidden; }
    .nav { height: 86px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(32px, 6vw, 104px); border-bottom: 1px solid #e6f0f8; background: rgba(255,255,255,.96); }
    .wordmark { width: 144px; height: 36px; object-fit: contain; }
    .links { display: flex; gap: clamp(22px, 3vw, 48px); font-size: 15px; }
    .links span { white-space: nowrap; }
    .hero { position: relative; isolation: isolate; min-height: calc(100vh - 86px); display: grid; place-items: center; padding: 72px 24px 92px; text-align: center; }
    .hero::before { content: ""; position: absolute; z-index: -2; inset: 0; background-image: linear-gradient(#dceefa 1px, transparent 1px), linear-gradient(90deg, #dceefa 1px, transparent 1px); background-size: 72px 72px; opacity: .76; }
    .hero::after { content: ""; position: absolute; z-index: -1; width: min(1050px, 80vw); height: min(720px, 70vw); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(172,219,255,.52) 0%, rgba(225,244,255,.35) 36%, transparent 70%); }
    .field { position: absolute; z-index: -1; width: min(900px, 82vw); aspect-ratio: 1; border: 1px solid rgba(20,98,208,.15); border-radius: 50%; box-shadow: 0 0 0 72px rgba(20,98,208,.035), 0 0 0 145px rgba(20,98,208,.018); }
    .mark { position: absolute; z-index: -1; top: 50%; left: 50%; width: 184px; height: 145px; overflow: hidden; transform: translate(-50%, -54%); opacity: .2; filter: saturate(1.3); }
    .mark img { display: block; width: 576px; max-width: none; height: 144px; }
    .content { position: relative; max-width: 1050px; }
    h1 { max-width: 1000px; margin: 0 auto; font-family: Montserrat, Arial, sans-serif; font-size: clamp(42px, 5.1vw, 78px); line-height: 1.12; letter-spacing: -.045em; }
    h1 span { color: var(--blue); }
    p { max-width: 720px; margin: 28px auto 0; color: #31516e; font-size: clamp(17px, 1.5vw, 21px); line-height: 1.55; }
    .actions { display: flex; justify-content: center; gap: 18px; margin-top: 42px; }
    .button { min-width: 190px; padding: 16px 24px; border: 1px solid var(--blue); border-radius: 999px; color: var(--blue); font-weight: 700; font-size: 16px; background: #fff; }
    .button.primary { color: #fff; background: var(--blue); box-shadow: 0 9px 20px rgba(20,98,208,.16); }
    @media (max-width: 700px) { .links { display:none; } .nav { height: 68px; padding: 0 24px; } .hero { min-height: calc(100vh - 68px); } .field { width: 115vw; } .mark { transform: translate(-50%, -50%) scale(.78); } .actions { flex-direction: column; align-items: center; } }
  </style>
</head>
<body>
  <main class="mockup">
    <nav class="nav" aria-label="Mockup navigation"><img class="wordmark" src="../assets/logo.svg" alt="Better Direct AI"><div class="links"><span>Contracts</span><span>Solutions</span><span>Industries</span><span>About</span><span>Resources</span></div></nav>
    <section class="hero" aria-labelledby="title">
      <div class="field" aria-hidden="true"></div>
      <div class="mark" aria-hidden="true"><img src="../assets/logo.svg" alt=""></div>
      <div class="content"><h1 id="title">Leading <span>SDVOSB</span> &amp; <span>HUBZone</span><br>IT Provider in Arizona</h1><p>Since 2006, Better Direct AI has helped federal agencies, schools and enterprises get the right technology, on contract, on time and on budget.</p><div class="actions"><button class="button primary">Explore Contracts</button><button class="button">Request Quote</button></div></div>
    </section>
  </main>
</body>
</html>
